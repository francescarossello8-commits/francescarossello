<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Essere sui social non basta</title>
  <desc id="desc">Visual verticale per FR Visual Design: il Metodo FR applicato alla comunicazione social.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100d"/>
      <stop offset="0.58" stop-color="#171510"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e482a"/>
      <stop offset="1" stop-color="#d37a43"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="38" y="38" width="824" height="1124" rx="22" fill="none" stroke="#c7a45a" stroke-opacity="0.34"/>
  <path d="M74 88h108M74 1112h108M718 88h108M718 1112h108" stroke="#c7a45a" stroke-width="3" stroke-linecap="round" opacity="0.62"/>

  <g transform="translate(80 116)">
    <text x="0" y="0" fill="#c7a45a" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2.6">METODO FR / SOCIAL DESIGN</text>
    <text x="0" y="104" fill="#f5efe2" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="600">Essere sui</text>
    <text x="0" y="194" fill="#f5efe2" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="600">social</text>
    <text x="0" y="292" fill="#c8663c" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="600">non basta</text>
    <text x="2" y="356" fill="#ddd2be" font-family="Arial, sans-serif" font-size="29">Prima capire. Poi comunicare.</text>
  </g>

  <g transform="translate(565 120)" opacity="0.95">
    <circle cx="132" cy="132" r="92" fill="none" stroke="#c7a45a" stroke-width="16" stroke-opacity="0.18"/>
    <circle cx="132" cy="132" r="62" fill="none" stroke="#f5efe2" stroke-width="13" stroke-opacity="0.23"/>
    <circle cx="132" cy="132" r="34" fill="#c7a45a" opacity="0.92"/>
    <path d="M132 132 236 54" stroke="#f5efe2" stroke-width="8" stroke-linecap="round"/>
    <path d="M236 54 282 42 266 88z" fill="#c7a45a"/>
  </g>

  <g transform="translate(80 532)" filter="url(#softShadow)">
    <rect width="740" height="104" rx="16" fill="url(#rust)" stroke="#e5c078" stroke-width="3"/>
    <path d="M48 52h48M72 28v48" stroke="#fff8ed" stroke-width="9" stroke-linecap="round" opacity="0.94"/>
    <text x="124" y="48" fill="#fff8ed" font-family="Arial, sans-serif" font-size="28" font-weight="900">Un post bello ma sbagliato</text>
    <text x="124" y="82" fill="#fff8ed" font-family="Arial, sans-serif" font-size="28" font-weight="900">può indebolire il brand.</text>
  </g>

  <g transform="translate(80 700)">
    <g>
      <rect width="740" height="110" rx="16" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="52" cy="55" r="25" fill="#c7a45a"/>
      <text x="44" y="65" fill="#11100d" font-family="Arial, sans-serif" font-size="28" font-weight="900">1</text>
      <text x="96" y="48" fill="#f5efe2" font-family="Arial, sans-serif" font-size="26" font-weight="900">Originalità mirata</text>
      <text x="96" y="82" fill="#ddd2be" font-family="Arial, sans-serif" font-size="23">Attirare lo sguardo giusto, con uno scopo.</text>
    </g>

    <g transform="translate(0 136)">
      <rect width="740" height="110" rx="16" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="52" cy="55" r="25" fill="#c7a45a"/>
      <text x="44" y="65" fill="#11100d" font-family="Arial, sans-serif" font-size="28" font-weight="900">2</text>
      <text x="96" y="48" fill="#f5efe2" font-family="Arial, sans-serif" font-size="26" font-weight="900">Radici</text>
      <text x="96" y="82" fill="#ddd2be" font-family="Arial, sans-serif" font-size="23">Restare fedeli a ciò che è vero.</text>
    </g>

    <g transform="translate(0 272)">
      <rect width="740" height="110" rx="16" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="52" cy="55" r="25" fill="#c7a45a"/>
      <text x="44" y="65" fill="#11100d" font-family="Arial, sans-serif" font-size="28" font-weight="900">3</text>
      <text x="96" y="48" fill="#f5efe2" font-family="Arial, sans-serif" font-size="26" font-weight="900">Ritmo</text>
      <text x="96" y="82" fill="#ddd2be" font-family="Arial, sans-serif" font-size="23">Costruire un percorso riconoscibile.</text>
    </g>
  </g>

  <g transform="translate(80 1116)">
    <text x="0" y="0" fill="#f5efe2" font-family="Georgia, 'Times New Roman', serif" font-size="37" font-style="italic">Se non è chiaro, non funziona.</text>
    <text x="532" y="0" fill="#c7a45a" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.8">FR VISUAL DESIGN</text>
  </g>
</svg>
