<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Essere sui social non basta</title>
  <desc id="desc">Visual editoriale per FR Visual Design: il Metodo FR applicato alla comunicazione social.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100d"/>
      <stop offset="0.56" stop-color="#171510"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e482a"/>
      <stop offset="1" stop-color="#d37a43"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="46" y="46" width="1508" height="808" rx="20" fill="none" stroke="#c7a45a" stroke-opacity="0.34"/>
  <path d="M92 96h120M92 804h120M1388 96h120M1388 804h120" stroke="#c7a45a" stroke-width="3" stroke-linecap="round" opacity="0.64"/>

  <g transform="translate(108 108)">
    <text x="0" y="0" fill="#c7a45a" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">METODO FR / SOCIAL DESIGN</text>
    <text x="0" y="104" fill="#f5efe2" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="600">Essere sui social</text>
    <text x="0" y="222" fill="#c8663c" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="600">non basta</text>
    <text x="4" y="294" fill="#ddd2be" font-family="Arial, sans-serif" font-size="34">Prima di pubblicare bisogna capire cosa dire, quando dirlo e a chi.</text>
  </g>

  <g transform="translate(1130 102)" opacity="0.96">
    <circle cx="188" cy="152" r="132" fill="none" stroke="#c7a45a" stroke-width="22" stroke-opacity="0.18"/>
    <circle cx="188" cy="152" r="94" fill="none" stroke="#f5efe2" stroke-width="18" stroke-opacity="0.24"/>
    <circle cx="188" cy="152" r="54" fill="#c7a45a" opacity="0.92"/>
    <path d="M188 152 334 38" stroke="#f5efe2" stroke-width="10" stroke-linecap="round"/>
    <path d="M334 38 394 22 374 82z" fill="#c7a45a"/>
    <path d="M54 274c52-24 86-22 124 3-51 27-89 24-124-3z" fill="#24302f"/>
    <path d="M134 304c44-10 73 2 98 34-48 12-80-2-98-34z" fill="#c7a45a" opacity="0.82"/>
  </g>

  <g transform="translate(124 440)" filter="url(#softShadow)">
    <rect width="1352" height="98" rx="16" fill="url(#rust)" stroke="#e5c078" stroke-width="3"/>
    <path d="M62 50h60M92 20v60" stroke="#fff8ed" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
    <text x="160" y="62" fill="#fff8ed" font-family="Arial, sans-serif" font-size="42" font-weight="800">Un post bello ma sbagliato può indebolire il brand.</text>
  </g>

  <g transform="translate(124 582)">
    <g>
      <rect width="410" height="190" rx="18" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="56" cy="58" r="28" fill="#c7a45a"/>
      <text x="47" y="69" fill="#11100d" font-family="Arial, sans-serif" font-size="30" font-weight="900">1</text>
      <text x="104" y="56" fill="#f5efe2" font-family="Arial, sans-serif" font-size="28" font-weight="900">Originalità mirata</text>
      <text x="104" y="96" fill="#c7a45a" font-family="Arial, sans-serif" font-size="21" font-weight="800">A chi parlo?</text>
      <text x="104" y="130" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">Il contenuto deve attirare</text>
      <text x="104" y="160" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">lo sguardo giusto.</text>
    </g>

    <g transform="translate(471 0)">
      <rect width="410" height="190" rx="18" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="56" cy="58" r="28" fill="#c7a45a"/>
      <text x="47" y="69" fill="#11100d" font-family="Arial, sans-serif" font-size="30" font-weight="900">2</text>
      <text x="104" y="56" fill="#f5efe2" font-family="Arial, sans-serif" font-size="28" font-weight="900">Radici</text>
      <text x="104" y="96" fill="#c7a45a" font-family="Arial, sans-serif" font-size="21" font-weight="800">Che cosa è vero?</text>
      <text x="104" y="130" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">Immagini, parole e promesse</text>
      <text x="104" y="160" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">devono reggere nella realtà.</text>
    </g>

    <g transform="translate(942 0)">
      <rect width="410" height="190" rx="18" fill="#f5efe2" fill-opacity="0.08" stroke="#c7a45a" stroke-opacity="0.45"/>
      <circle cx="56" cy="58" r="28" fill="#c7a45a"/>
      <text x="47" y="69" fill="#11100d" font-family="Arial, sans-serif" font-size="30" font-weight="900">3</text>
      <text x="104" y="56" fill="#f5efe2" font-family="Arial, sans-serif" font-size="28" font-weight="900">Ritmo</text>
      <text x="104" y="96" fill="#c7a45a" font-family="Arial, sans-serif" font-size="21" font-weight="800">Quando ha senso?</text>
      <text x="104" y="130" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">Ogni post deve costruire</text>
      <text x="104" y="160" fill="#ddd2be" font-family="Arial, sans-serif" font-size="22">un percorso riconoscibile.</text>
    </g>
  </g>

  <g transform="translate(108 822)">
    <text x="0" y="0" fill="#f5efe2" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic">Se non è chiaro, non funziona.</text>
    <text x="1018" y="0" fill="#c7a45a" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">FR VISUAL DESIGN</text>
  </g>
</svg>
